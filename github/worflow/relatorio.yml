name: Testes de API e relatório Allure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # os testes [BUG] falham de propósito, então o build não pode parar aqui
      - name: Rodar testes
        run: mvn clean test -Dmaven.test.failure.ignore=true

      - name: Gerar relatório Allure
        run: mvn allure:report

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

  publicar:
    needs: testes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4